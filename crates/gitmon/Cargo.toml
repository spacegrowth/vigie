[package]
name = "gitmon"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Polling engine for Vigie: GitHub client, event store, and poller."

[lib]
name = "gitmon"
path = "src/lib.rs"

[dependencies]
# No TLS via the system OpenSSL, and no default features, to keep the bundle small.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
url = "2"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
log = "0.4"

[dev-dependencies]
mockito = "1"
tempfile = "3"
