<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Vigie app icon. Original artwork.
       A lookout's spyglass: a stepped draw-tube that widens toward the
       objective, angled up and out, with two stars it is trained on.
       The steps and the dark cap at the wide end are deliberate — a
       straight tube with a lit wide end reads as a torch, not a telescope.
       Pale sage tile so the icon matches the mark used inside the app and
       in the menu bar; the lower wash arcs upward through the middle and
       fades in rather than filling a flat shape, so its edge reads as light
       falling off instead of a second shape laid on top. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8ece5"/>
      <stop offset="1" stop-color="#d3ddcf"/>
    </linearGradient>
    <linearGradient id="wash" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b4d31" stop-opacity="0"/>
      <stop offset="1" stop-color="#1b4d31" stop-opacity="0.26"/>
    </linearGradient>
    <clipPath id="tileClip"><rect width="1024" height="1024" rx="227"/></clipPath>
  </defs>
  <rect width="1024" height="1024" rx="227" fill="url(#tile)"/>
  <g clip-path="url(#tileClip)">
    <path d="M0 576C256 448 768 448 1024 576V1024H0z" fill="url(#wash)"/>
  </g>
  <g transform="translate(512,512) scale(1.1) translate(-512,-512)">
    <g transform="rotate(-38 512 512)">
  <rect x="150" y="451.0" width="120" height="122.0" rx="26" fill="#cfe8d6"/>
  <rect x="250" y="432.7" width="210" height="158.6" rx="30" fill="#2f7a4f"/>
  <rect x="440" y="414.4" width="215" height="195.2" rx="34" fill="#2f7a4f"/>
  <rect x="635" y="390.0" width="225" height="244.0" rx="40" fill="#2f7a4f"/>
  <rect x="248" y="432.7" width="18" height="158.6" rx="9" fill="#1b4d31"/>
  <rect x="438" y="414.4" width="18" height="195.2" rx="9" fill="#1b4d31"/>
  <rect x="633" y="390.0" width="18" height="244.0" rx="9" fill="#1b4d31"/>
  <rect x="836" y="426.6" width="26" height="170.8" rx="13" fill="#1b4d31"/>
    </g>
    <circle cx="822" cy="196" r="38" fill="#2f7a4f"/>
    <circle cx="906" cy="298" r="22" fill="#2f7a4f"/>
  </g>
</svg>
